name: Upgrade dependencies
on:
  push:
    branches:
      - chore/latest-dependencies

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run automated dependency upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/latest-dependencies
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Upgrade npm dependencies
        working-directory: frontend
        run: |
          npm install --save-exact \
            @tanstack/react-query@latest \
            lucide-react@latest \
            react@latest \
            react-dom@latest \
            react-router-dom@latest
          npm install --save-dev --save-exact \
            @playwright/test@latest \
            @types/react@latest \
            @types/react-dom@latest \
            @vitejs/plugin-react@latest \
            prettier@latest \
            typescript@latest \
            vite@latest
          npm run build

      - name: Upgrade Go dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Upgrade runtime and CI versions
        run: |
          sed -i 's/FROM node:22-alpine/FROM node:24-alpine/' Dockerfile
          sed -i 's/FROM alpine:3.23/FROM alpine:3.24/' Dockerfile
          sed -i 's/actions\/checkout@v4/actions\/checkout@v7/' .github/workflows/check.yml
          sed -i 's/actions\/setup-go@v5/actions\/setup-go@v7/' .github/workflows/check.yml
          sed -i 's/actions\/setup-node@v4/actions\/setup-node@v7/' .github/workflows/check.yml
          sed -i 's/actions\/upload-artifact@v4/actions\/upload-artifact@v7/' .github/workflows/check.yml
          sed -i 's/node-version: 22/node-version: 24/' .github/workflows/check.yml

      - name: Record upgrade
        run: |
          rm .github/workflows/dependency-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade dependencies to latest stable versions"
          git push origin HEAD:chore/latest-dependencies
