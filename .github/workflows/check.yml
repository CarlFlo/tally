name: Checks
on:
  push:
  pull_request:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # Same-repository PR commits are already validated by their push run.
    # Keep pull_request coverage for forks, where the base repository sees no push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: go vet ./... && go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results
      - run: docker build -t tally:check .
      - name: Verify container starts
        run: |
          id=$(docker run -d --rm tally:check)
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$id" tally healthcheck; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' "$id" | grep -q true; then
              docker logs "$id"
              exit 1
            fi
            sleep 1
          done
          docker logs "$id"
          exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tally:check
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
